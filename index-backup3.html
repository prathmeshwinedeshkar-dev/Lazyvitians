 if(LB=='ultra'){const d=g('a'),T=g('b'),v=331.3+.606*T,t=2*d/100/v*1e6,x=44+d/400*230;o(`Speed of sound v = 331.3 + 0.606 × T = ${v.toFixed(1)} m/s<br>Echo time t = 2d / v = ${t.toFixed(0)} µs<br>Distance d = t × v / 2 = ${d} cm`);sv(SV(`<rect x="8" y="45" width="24" height="40" rx="4" fill="#a78bfa"/><rect x="${x.toFixed(0)}" y="30" width="14" height="70" rx="3" fill="#d6f94a"/>${[1,2,3].map(i=>`<path d="M${30+i*12} 38 q12 27 0 54" fill="none" stroke="#a78bfa" stroke-opacity="${1-i*.25}"/>`).join('')}<text x="8" y="120" fill="#8f8f9d" font-size="10">sensor</text><text x="${(x-6).toFixed(0)}" y="120" fill="#8f8f9d" font-size="10">object</text>`,'Ultrasonic sensor and object'))}
 if(LB=='ldr'){const lux=Math.pow(10,g('a')/100*3),R=15000*Math.pow(10/lux,.7),V=5*1e4/(1e4+R),adc=Math.round(V/5*1023),pw=Math.round(adc/1023*255);o(`Light = ${lux.toFixed(0)} lux<br>LDR resistance ≈ ${(R/1000).toFixed(1)} kΩ (typical model 15k × (10/lux)^0.7)<br>5 V → LDR → output → 10 kΩ → GND<br>Vout = 5 × 10k / (10k + R) = ${V.toFixed(2)} V<br>ADC reading (0 to 1023) = ${adc}<br>Scaled to 0 to 255 = ${pw}`);sv(SV(`<rect x="20" y="20" width="${Math.max(2,adc/1023*180).toFixed(0)}" height="22" rx="4" fill="#a78bfa"/><text x="20" y="60" fill="#8f8f9d" font-size="10">ADC value</text><circle cx="270" cy="50" r="28" fill="#d6f94a" fill-opacity="${(pw/255).toFixed(2)}" stroke="#d6f94a"/><text x="240" y="100" fill="#8f8f9d" font-size="10">LED brightness</text>`,'ADC value and LED brightness'))}
 if(LB=='ntc'){const T=g('a'),R=1e4*Math.exp(3950*(1/(T+273.15)-1/298.15)),adc=Math.round(1023*R/(R+1e4)),Rm=1e4*adc/(1023-adc),Tm=1/(1/298.15+Math.log(Rm/1e4)/3950)-273.15;o(`NTC 10 kΩ, β = 3950 (typical)<br>5 V → 10 kΩ → output → NTC → GND<br>R(NTC) = 10k × e^(β(1/T − 1/T0)) = ${(R/1000).toFixed(2)} kΩ<br>ADC reading = ${adc}<br>Temperature from ADC = ${Tm.toFixed(1)} °C<br>Quantisation error = ${(Tm-T).toFixed(2)} °C`);sv(SV(`<rect x="20" y="50" width="280" height="14" rx="7" fill="#2a2a35"/><rect x="20" y="50" width="${((T+10)/110*280).toFixed(0)}" height="14" rx="7" fill="#d6f94a"/><text x="20" y="90" fill="#8f8f9d" font-size="10">−10 °C</text><text x="268" y="90" fill="#8f8f9d" font-size="10">100 °C</text>`,'Temperature bar'))}
 if(LB=='servo'){const a=g('a'),p=544+a/180*(2400-544),r=(180-a)*Math.PI/180;o(`Pulse width = 544 + angle/180 × (2400 − 544) = ${p.toFixed(0)} µs<br>Duty cycle at 50 Hz = ${(p/200).toFixed(1)} %`);sv(SV(`<path d="M90 105 A70 70 0 0 1 230 105" fill="none" stroke="#2a2a35" stroke-width="8"/><line x1="160" y1="105" x2="${(160+70*Math.cos(r)).toFixed(1)}" y2="${(105-70*Math.sin(r)).toFixed(1)}" stroke="#d6f94a" stroke-width="6" stroke-linecap="round"/><circle cx="160" cy="105" r="8" fill="#a78bfa"/>`,'Servo arm angle'))}
 if(LB=='pwm'){const v=g('a'),du=v/255,w=75;let d='M10 100';for(let i=0;i<4;i++){const x=10+i*w;d+=`L${x} 30L${(x+w*du).toFixed(1)} 30L${(x+w*du).toFixed(1)} 100L${x+w} 100`}o(`PWM value ${v} of 255 → duty = ${v}/255 = ${(du*100).toFixed(1)} %<br>Average voltage = 5 V × duty = ${(5*du).toFixed(2)} V<br>Used for LED brightness or DC motor speed`);sv(SV(`<path d="${d}" fill="none" stroke="#a78bfa" stroke-width="2.5"/>`,'PWM waveform'))}
 if(LB=='series'){const k=$('f').value,N=g('a'),x0=g('b'),F={sin:[Math.sin,n=>n%2?(((n-1)/2)%2?-1:1)/fact(n):0],cos:[Math.cos,n=>n%2?0:((n/2)%2?-1:1)/fact(n)],exp:[Math.exp,n=>1/fact(n)],ln:[x=>x>-1?Math.log(1+x):NaN,n=>n?(n%2?1:-1)/n:0],geo:[x=>x==1?NaN:1/(1-x),n=>1]}[k],P=x=>{let s=0;for(let n=0;n<=N;n++)s+=F[1](n)*Math.pow(x,n);return s},X=x=>160+x*40,Y=y=>65-y*14,
 path=(f,c)=>{let d='',pen=false;for(let i=0;i<=160;i++){const x=-4+i*.05,y=f(x);if(isFinite(y)&&Math.abs(y)<4.5){d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);pen=true}else pen=false}return `<path d="${d}" fill="none" stroke="${c}" stroke-width="2"/>`},fx=F[0](x0);
 o(`<span style="color:#a78bfa">■ f(x)</span> <span style="color:#d6f94a">■ Maclaurin polynomial, degree ${N}</span><br>f(${x0}) = ${isFinite(fx)?fx.toFixed(4):'undefined'}<br>P(${x0}) = ${P(x0).toFixed(4)}<br>Error = ${isFinite(fx)?Math.abs(fx-P(x0)).toFixed(4):'n/a'}${k=='ln'||k=='geo'?'<br>Valid only for |x| < 1 (radius of convergence)':''}`);sv(SV(`<line x1="0" y1="65" x2="320" y2="65" stroke="#3a3a48"/><line x1="160" y1="0" x2="160" y2="130" stroke="#3a3a48"/>${path(F[0],'#a78bfa')}${path(P,'#d6f94a')}<circle cx="${X(x0).toFixed(1)}" cy="65" r="3" fill="#fff"/>`,'Function and its polynomial approximation'))}}
